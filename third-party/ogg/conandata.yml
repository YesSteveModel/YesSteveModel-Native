sources:
  "1.3.6":
    url: https://github.com/xiph/ogg
    tag: v1.3.6
patches:
  "1.3.6":
  - patch_file: patches/ogg.patch
requirements:
- mimalloc/3.6.0@ysm/stable
build:
  global_link_targets:
  - mimalloc-static
  options:
    BUILD_SHARED_LIBS: false
    BUILD_TESTING: false
    INSTALL_DOCS: false
    INSTALL_PKG_CONFIG_MODULE: false
  install: true
package:
  cmake_file_name: Ogg
  cmake_target_name: Ogg::ogg
  includedirs:
  - include
