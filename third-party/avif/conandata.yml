sources:
  1.4.2:
    url: https://github.com/AOMediaCodec/libavif
    tag: v1.4.2
    commit: c5240fc79fe5c2407e10afd35f5505ef6333ea49
patches:
  1.4.2:
  - patch_file: patches/avif.patch
  - patch_file: patches/avif-mimalloc.patch
requirements:
- yuv/0.0.1974@ysm/stable
- dav1d/1.5.4@ysm/stable
- webp/1.6.0@ysm/stable
- mimalloc/3.6.0@ysm/stable
- ref: svt-av1/4.2.0@ysm/stable
  skip_os:
  - android
build:
  global_link_targets:
  - mimalloc-static
  options:
    AVIF_BUILD_APPS: false
    AVIF_BUILD_TESTS: false
    AVIF_CODEC_DAV1D: true
    AVIF_CODEC_SVT:
      android: false
      default: true
    AVIF_ENABLE_NODISCARD: true
    AVIF_LIBSHARPYUV: true
    AVIF_LIBYUV: true
    BUILD_SHARED_LIBS: false
  install: false
package:
  cmake_file_name: avif
  cmake_target_name: avif
  libs:
  - avif_internal
  manual_headers:
  - dst: include
    pattern: '*'
    src: include
