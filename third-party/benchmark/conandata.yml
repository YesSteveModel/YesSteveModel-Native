sources:
  "1.10.0":
    url: https://github.com/google/benchmark
    tag: v1.10.0
patches:
  "1.10.0": []
requirements: []
build:
  options:
    BUILD_SHARED_LIBS: false
    BENCHMARK_DOWNLOAD_DEPENDENCIES: false
    BENCHMARK_ENABLE_ASSEMBLY_TESTS: false
    BENCHMARK_ENABLE_DOXYGEN: false
    BENCHMARK_ENABLE_GTEST_TESTS: false
    BENCHMARK_ENABLE_INSTALL: true
    BENCHMARK_ENABLE_TESTING: false
    BENCHMARK_ENABLE_WERROR: false
    BENCHMARK_INSTALL_DOCS: false
    BENCHMARK_INSTALL_TOOLS: false
    BENCHMARK_USE_BUNDLED_GTEST: false
  install: true
package:
  cmake_file_name: benchmark
  cmake_target_name: benchmark
  components:
    benchmark:
      target: benchmark::benchmark
      libs:
      - benchmark
    benchmark_main:
      target: benchmark::benchmark_main
      libs:
      - benchmark_main
