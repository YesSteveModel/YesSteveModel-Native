sources:
  3.2.0:
    url: https://github.com/libjpeg-turbo/libjpeg-turbo
    tag: 3.2.0
    commit: c85e6b905bf237038faa936dab160ebfc5da0344
patches:
  3.2.0:
  - patch_file: patches/jpeg-turbo.patch
  - patch_file: patches/jpeg-turbo-mimalloc.patch
requirements:
- zlib-ng/2.3.3@ysm/stable
- mimalloc/3.6.0@ysm/stable
build:
  global_link_targets:
  - mimalloc-static
  - zlib-ng-static
  options:
    ENABLE_SHARED: false
    WITH_ARITH_ENC: false
    WITH_TESTS: false
    WITH_TOOLS: false
    WITH_SYSTEM_ZLIB: true
  install: true
  copy_built_libraries: true
package:
  cmake_file_name: jpeg-turbo
  cmake_target_name: turbojpeg-static
  includedirs:
  - include
