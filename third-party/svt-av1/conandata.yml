sources:
  4.2.0:
    url: https://gitlab.com/AOMediaCodec/SVT-AV1
    tag: v4.2.0
    commit: 9292ec8e32bce26f781f277ec8739b53426c4300
patches:
  4.2.0:
  - patch_file: patches/svt-av1.patch
  - patch_file: patches/svt-av1-mimalloc.patch
requirements:
- mimalloc/3.6.0@ysm/stable
build:
  global_link_targets:
  - mimalloc-static
  options:
    BUILD_APPS: false
    BUILD_SHARED_LIBS: false
    BUILD_TESTING: false
    COVERAGE: false
    ENABLE_AVX512: true
    LOG_QUIET: true
    NATIVE: false
    SVT_AV1_LTO: true
    SVT_AV1_PGO: false
    SVT_INTERNAL_PGO_GENERATE: false
    SVT_INTERNAL_PGO_USE: false
  install: true
package:
  cmake_file_name: svt-av1
  cmake_target_name: SvtAv1Enc
  includedirs:
  - include/svt-av1
