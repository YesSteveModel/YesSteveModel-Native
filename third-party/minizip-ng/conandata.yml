sources:
  "4.2.2":
    url: https://github.com/zlib-ng/minizip-ng
    tag: 4.2.2
patches:
  "4.2.2":
  - patch_file: patches/minizip-ng.patch
  - patch_file: patches/minizip-ng-mimalloc.patch
requirements:
- zlib-ng/2.3.3@ysm/stable
- mimalloc/3.6.0@ysm/stable
build:
  global_link_targets:
  - mimalloc-static
  options:
    BUILD_SHARED_LIBS: false
    MZ_BUILD_TESTS: false
    MZ_BZIP2: false
    MZ_DECOMPRESS_ONLY: true
    MZ_FETCH_LIBS: false
    MZ_LIBBSD: false
    MZ_LIBCOMP: false
    MZ_LZMA: false
    MZ_OPENSSL: false
    MZ_PKCRYPT: false
    MZ_PPMD: false
    MZ_WZAES: false
    MZ_ZSTD: false
  install: true
package:
  cmake_file_name: minizip-ng
  cmake_target_name: minizip
  includedirs:
  - include
  - include/minizip
