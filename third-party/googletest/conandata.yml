sources:
  '1.18.0':
    url: https://github.com/google/googletest
    tag: v1.18.0
patches:
  '1.18.0': []
build:
  options:
    BUILD_SHARED_LIBS: false
    BUILD_GMOCK: false
    INSTALL_GTEST: true
    GTEST_HAS_ABSL: true
    gtest_build_tests: false
    gtest_build_samples: false
    gtest_force_shared_crt: false
  install: true
package:
  cmake_file_name: GTest
  cmake_target_name: GTest
  components:
    gtest:
      target: GTest::gtest
      libs:
      - gtest
    gtest_main:
      target: GTest::gtest_main
      libs:
      - gtest_main
