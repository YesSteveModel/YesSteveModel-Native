sources:
  "5.7.0":
    url: https://github.com/jrouwe/JoltPhysics
    tag: v5.7.0
    archive_url: https://codeload.github.com/jrouwe/JoltPhysics/zip/refs/tags/v5.7.0
    sha256: e98f1c5b3e7227a96e7aef9c7ffc25fb35bb1cfe16c69207442bd4c1a447d924
patches:
  "5.7.0":
  - patch_file: patches/jolt-mimalloc.patch
  - patch_file: patches/jolt-build-platform.patch
  - patch_file: patches/jolt-exp-damping.patch
requirements:
- mimalloc/3.6.0@ysm/stable
build:
  subdir: Build
  global_link_targets:
  - mimalloc-static
  options:
    BUILD_SHARED_LIBS: false
    JPH_BUILD_SHARED_LIBS: false
    ENABLE_ALL_WARNINGS: false
    DOUBLE_PRECISION: false
    DEBUG_RENDERER_IN_DEBUG_AND_RELEASE: false
    PROFILER_IN_DEBUG_AND_RELEASE: false
    ENABLE_OBJECT_STREAM: false
    DISABLE_CUSTOM_ALLOCATOR: false
    CPP_RTTI_ENABLED: true
    USE_STATIC_MSVC_RUNTIME_LIBRARY: false
    FLOATING_POINT_EXCEPTIONS_ENABLED: false
    INTERPROCEDURAL_OPTIMIZATION: false
    OVERRIDE_CXX_FLAGS: false
    GENERATE_DEBUG_SYMBOLS: false
    TARGET_UNIT_TESTS: false
    TARGET_HELLO_WORLD: false
    TARGET_PERFORMANCE_TEST: false
    TARGET_SAMPLES: false
    TARGET_VIEWER: false
    JPH_USE_DX12: false
    JPH_USE_VK: false
    JPH_USE_MTL: false
    JPH_USE_CPU_COMPUTE: false
    USE_SSE4_1: false
    USE_SSE4_2: false
    USE_AVX: false
    USE_AVX2: false
    USE_AVX512: false
    USE_F16C: false
    USE_LZCNT: false
    USE_TZCNT: false
    USE_FMADD: false
package:
  cmake_file_name: Jolt
  cmake_target_name: Jolt::Jolt
